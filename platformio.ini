; flood + air warning station - ESP32-2432S028R "cheap yellow display"
; same board setup that worked for nowtron (ili9341 panel, lovyangfx)
[env:cyd]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.partitions = huge_app.csv
lib_deps =
    lovyan03/LovyanGFX@^1.1.16
build_flags =
    -DCORE_DEBUG_LEVEL=1
    ; my board is the ili9341 kind, so this stays off
    ; -DCYD_ST7789
